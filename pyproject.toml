[project]
name = "scacchi"
version = "0.1.0"
description = "Implementation of a command-line chess game"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "numpy>=2.2.5",
    "rich>=13.9.4",
    "ruff>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.0.0",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pydocstyle
    "D",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = ["D203", "D213", "D100", "D102", "D107"]
